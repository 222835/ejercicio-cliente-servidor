# Configuración del servidor SSH del proyecto.
#
# Instalación:
#   sudo cp 01-proyecto.conf /etc/ssh/sshd_config.d/01-proyecto.conf
#   sudo sshd -t 
#   sudo systemctl restart ssh
#

# --- Autenticación: solo con llave pública -----------------------------------
# Nadie puede entrar directamente como root.
PermitRootLogin no

# Sin contraseñas: elimina por completo los ataques de adivinación de contraseña.
PasswordAuthentication no
KbdInteractiveAuthentication no

# La única forma de autenticarse es demostrando que se posee la llave privada.
PubkeyAuthentication yes

# --- Autorización: quién puede entrar ------------------------------------------
# Solo las cuentas que pertenecen al grupo sshusers. Una cuenta que existe
# pero no está en el grupo (ej. "invitado") es rechazada aunque tenga llave.
AllowGroups sshusers

# --- Límites contra abuso --------------------------------------------------------
# Máximo de intentos de autenticación por conexión.
MaxAuthTries 3

# Segundos para completar la autenticación antes de cerrar la conexión.
LoginGraceTime 30

# --- Registro ----------------------------------------------------------------------
# VERBOSE registra además la huella de la llave usada en cada acceso,
# lo que permite saber exactamente qué llave entró. Los eventos quedan en
# /var/log/auth.log (con rsyslog) o en: journalctl -u ssh
LogLevel VERBOSE
